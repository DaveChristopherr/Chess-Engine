<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dave Christopher — Chess Engine</title>
    <meta name="description" content="Dave Christopher Python-powered chess engine with retro interface" />
    <meta property="og:title" content="Dave Christopher Chess Engine" />
    <meta property="og:description" content="Dave Christopher Python-powered chess engine with retro interface" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/Dave%20Christopher%20Logo.png">
    <link rel="shortcut icon" href="/Dave%20Christopher%20Logo.png">
    <link rel="apple-touch-icon" href="/Dave%20Christopher%20Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<canvas id="rainCanvas"></canvas>

<div class="site">
    <div class="text-box">
        <div class="bot-profile-row">
            <div class="player-info">
                <div class="avatar">
                    <img id="bot-img" src="/521174315.c110b96e.32x32o.c4d93e3c2fc2@2x.jpg" alt="davechristopherrr">
                </div>
                <div class="player-details">
                    <span class="player-name">davechristopherrr</span>
                    <span class="player-rating">(2000)</span>
                </div>
            </div>

            <div class="top-controls">
                <button class="pixel-btn" onclick="toggleSettings()">MENU ▾</button>
                <div class="settings-menu" id="settings-menu">
                    <button onclick="handleMenu('new')">NEW GAME</button>
                    <button onclick="handleMenu('flip')">FLIP BOARD</button>
                    <button onclick="handleMenu('resign')">RESIGN</button>
                </div>
            </div>
        </div> 
    </div>

    <div class="board-container">
        <div id="board" class="board"></div>
    </div>

    <div class="text-box">
        <div class="controls-row">
            <div class="player-info">
                <div class="avatar">
                    <svg style="width:24px;height:24px;fill:#fff;" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="player-details">
                    <span class="player-name">you</span>
                </div>
            </div>

            <div class="history-controls">
                <button class="pixel-btn" onclick="undoMove()">&lt; UNDO</button>
                <button class="pixel-btn" onclick="redoMove()">REDO &gt;</button>
            </div>
        </div>
    </div>

    <div id="game-over-status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
